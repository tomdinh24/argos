"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
run_mode = "concurrent"
setup = "uv sync --dev && (cd web && npm install)"

[scripts.run.run]
available_in = "local"
command = "npx --yes concurrently -k -n api,web \"uv run uvicorn argos.api.app:app --port $CONDUCTOR_PORT\" \"cd web && NEXT_PUBLIC_API_BASE=http://localhost:$CONDUCTOR_PORT npm run dev -- -p $((CONDUCTOR_PORT+1))\""
default = true
icon = "play"
